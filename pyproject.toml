[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "announcement-recorder"
version = "0.1.0"
description = "Paper-only announcement latency and market-data research recorder"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<0.29", "websockets>=16,<17", "exchange-calendars>=4.11,<5"]

[project.scripts]
announcement-recorder = "recorder.cli:main"

[tool.setuptools.packages.find]
include = ["recorder*"]
